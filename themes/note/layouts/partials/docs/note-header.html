<div class="note-header">
  <div class="note-title">
    <a href="{{.RelPermalink}}">
      {{partial "docs/title.html" .}}
    </a>
  </div>
  <div class="note-meta">
      <span class="small-title">最近更新:</span>
      <span class="Lastmod" data-unix="{{ .Lastmod.Unix }}"></span>
        {{if .IsNode}} 
        <span class="small-title">笔记数:</span>
            {{len .Pages}}
        {{else}}
        <span class="small-title">笔记字数:</span>
            {{ .Content | countwords}}
        {{end}}
  </div>
</div>
